---
# Pinned versions make a deployment repeatable. Test upgrades before changing.
xray_version: v26.11.9
xui_version: v3.7.0

# REALITY camouflage targets. They must support TLS 1.3 and be reachable from
# the respective server. A domain owned by you is not required.
ru_reality_target: yandex.ru
# Select a stable TLS 1.3 site reachable from the chosen exit location.
exit_reality_target: www.hostkey.com

ru_inbound_remark: RU XHTTP REALITY
owner_email: owner

# Russian domain rules and RU IP ranges leave directly from RU. These services
# are forced through the foreign exit before RU rules are evaluated.
forced_exit_geosites:
  - youtube
  - telegram
forced_exit_geoips:
  - telegram

# The same base rules are used by routing and split DNS. Domain rules are
# evaluated before geoip:ru so known Russian services never depend on a
# foreign DNS answer.
ru_direct_domain_rules:
  - domain:ru
  - domain:su
  - domain:by
  - domain:xn--p1ai
  - geosite:category-gov-ru
  - geosite:category-ru
  - geosite:vk
  - geosite:yandex

# Dependencies of Russian services that use non-RU zones and may otherwise
# leave through the foreign exit. Values are base domains; subdomains match too.
additional_ru_direct_domains:
